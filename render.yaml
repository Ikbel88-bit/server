services:
  - type: web
    name: platenet-api
    env: node
    region: frankfurt
    plan: free
    
    # 🔧 BUILD COMMAND - Optimisé pour 512MB RAM (Build ultra-léger)
    buildCommand: |
      echo "🚀 Starting optimized build for Render Free Plan (512MB RAM)..."
      export NODE_OPTIONS="--max-old-space-size=400"
      echo "🧹 Cleaning old files..."
      rm -rf dist src/dist .npm node_modules/.cache test temp uploads/videos uploads/thumbnails
      echo "📦 Installing all dependencies (including dev)..."
      npm install --prefer-offline --no-audit --no-fund --legacy-peer-deps
      echo "🔨 Building with TypeScript..."
      export NODE_OPTIONS="--max-old-space-size=400"
      echo "📦 Installing tsc-alias to fix src/ imports..."
      npm install --no-save tsc-alias --legacy-peer-deps 2>&1 || true
      echo "🔨 Compiling TypeScript..."
      npm run build:render 2>&1 || echo "⚠️ TypeScript compilation had errors but continuing..."
      echo "🔧 Fixing import paths with tsc-alias..."
      if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
        echo "✅ dist directory exists with files, running tsc-alias..."
        npx tsc-alias -p tsconfig.build.json 2>&1 || ./node_modules/.bin/tsc-alias -p tsconfig.build.json 2>&1 || echo "⚠️ tsc-alias failed but continuing..."
      else
        echo "❌ dist directory not created or empty"
        ls -la dist 2>&1 || echo "dist does not exist"
        exit 1
      fi
      echo "🧹 Cleaning up dev dependencies..."
      npm prune --production --no-audit --no-fund 2>&1 || true
      rm -rf .npm node_modules/.cache test temp
      find node_modules -name "*.map" -type f -delete 2>&1 || true
      find node_modules -name "*.ts" -type f -delete 2>&1 || true
      echo "✅ Build completed successfully!"
    
    # 🔧 START COMMAND - 380MB pour laisser de la marge
    startCommand: node --max-old-space-size=380 dist/main.js
    
    # ✅ Health check
    healthCheckPath: /health
    
    # ✅ Auto-deploy sur push
    autoDeploy: true
    
    # 🌐 ENVIRONMENT VARIABLES
    envVars:
      # Node Configuration
      - key: NODE_ENV
        value: production
      
      - key: NODE_OPTIONS
        value: --max-old-space-size=380
      
      # Disable Swagger en production (économie RAM)
      - key: DISABLE_SWAGGER
        value: true
      
      # Cloudinary (Public - OK)
      - key: CLOUDINARY_CLOUD_NAME
        value: dg39chhco
      
      - key: CLOUDINARY_API_KEY
        value: 849123737586636
      
      # Cloudinary Secret (À définir dans Dashboard)
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # Database
      - key: MONGODB_URI
        sync: false
      
      # JWT
      - key: JWT_SECRET
        sync: false
      
      # Gemini AI
      - key: GEMINI_API_KEY
        sync: false
      
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      
      - key: STRIPE_API_VERSION
        value: 2025-11-17.clover
      
      - key: STRIPE_CURRENCY
        value: usd
      
      - key: STRIPE_CONNECT_ENABLED
        value: true
      
      - key: PLATFORM_COMMISSION_PERCENTAGE
        value: 5
      
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      
      - key: GOOGLE_CALLBACK_URL
        sync: false
      
      # URLs
      - key: FRONTEND_URL
        sync: false
      
      - key: BACKEND_URL
        sync: false
      
      - key: CORS_ORIGIN
        sync: false